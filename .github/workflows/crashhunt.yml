name: crashhunt
# 崩溃排查：推到 crashhunt* 分支时只跑 tools/crashhunt.sh（qa = R8 混淆后带测试钩子；再跑 debug），不发版
on:
  push:
    branches: ['crashhunt*']
  workflow_dispatch:
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.14.3' }
      - name: Build
        run: |
          gradle :app:assembleDebug :app:assembleQa -PallAbi -Ppreview --no-daemon
          mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/test-debug.apk && cp app/build/outputs/apk/qa/app-qa.apk out/test-qa.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device; for i in $(seq 1 90); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break; sleep 2; done; sleep 15
            adb shell settings put global hide_error_dialogs 1; adb shell svc power stayon true; adb shell input keyevent KEYCODE_WAKEUP
            r=0; bash tools/crashhunt.sh out/test-qa.apk qa || r=1; bash tools/crashhunt.sh out/test-debug.apk debug || r=1; adb logcat -d > shots/hunt-logcat.txt; echo "hunt result=$r"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: hunt, path: shots }
